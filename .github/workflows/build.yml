name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "В корне репозитория нет .zip файла"
            exit 1
          fi
          echo "Распаковываю $ZIP"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
          GRADLE_FILE=$(find "$RUNNER_TEMP/src" -name build.gradle | awk '{print length, $0}' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$GRADLE_FILE" ]; then
            echo "В архиве не найден build.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Проект: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cheatmod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
